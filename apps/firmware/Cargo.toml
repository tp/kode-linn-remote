[package]
name = "firmware"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
app-config.workspace = true
app-core.workspace = true
# Re-enable `lpec-diag` if LPEC parsing or session behaviour ever needs to be
# debugged on device — it routes per-line traces from `LpecSession::action` /
# `poll` through esp-println. Off by default because it floods the serial
# output once metadata events start streaming.
app-runtime = { workspace = true, features = [] }
board-waveshare-c6.workspace = true
embassy-executor.workspace = true
embassy-futures.workspace = true
embassy-net = { workspace = true, features = ["dhcpv4", "dns", "medium-ethernet", "tcp"] }
embassy-sync.workspace = true
embassy-time = { workspace = true, features = ["generic-queue-8"] }
embedded-graphics.workspace = true
esp-alloc = { workspace = true, features = ["esp32c6", "global-allocator", "compat"] }
esp-backtrace = { workspace = true, features = ["esp32c6", "panic-handler", "println"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32c6"] }
esp-hal = { workspace = true, features = ["esp32c6", "unstable"] }
esp-println = { workspace = true, features = ["esp32c6", "jtag-serial"] }
esp-radio = { workspace = true, features = ["esp32c6", "wifi", "esp-alloc", "unstable"] }
esp-rtos = { workspace = true, features = ["esp32c6", "esp-radio", "esp-alloc", "embassy"] }
heapless.workspace = true
linn-lpec.workspace = true
static_cell = { version = "2.1", default-features = false }
