[workspace]
resolver = "3"
members = [
    "apps/firmware",
    "apps/sim",
    "crates/app-config",
    "crates/app-core",
    "crates/app-runtime",
    "crates/board-waveshare-c6",
    "crates/linn-ci-gateway",
    "crates/linn-lpec",
]
default-members = [
    "apps/sim",
    "crates/app-config",
    "crates/app-core",
    "crates/app-runtime",
    "crates/board-waveshare-c6",
    "crates/linn-ci-gateway",
    "crates/linn-lpec",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
app-config = { path = "crates/app-config", default-features = false }
app-core = { path = "crates/app-core" }
app-runtime = { path = "crates/app-runtime", default-features = false }
board-waveshare-c6 = { path = "crates/board-waveshare-c6" }
embassy-futures = { version = "0.1.2", default-features = false }
embassy-executor = { version = "0.10.0", default-features = false }
embassy-net = { version = "0.9.1", default-features = false }
embassy-sync = { version = "0.8.0", default-features = false }
embassy-time = { version = "0.5.1", default-features = false }
embedded-graphics = { version = "0.8.2", default-features = false }
embedded-graphics-framebuf = { version = "0.5", default-features = false }
esp-alloc = { version = "0.10.0", default-features = false }
esp-backtrace = { version = "0.19.0", default-features = false }
esp-bootloader-esp-idf = { version = "0.5.0", default-features = false }
esp-hal = "1.0.0"
esp-println = { version = "0.17.0", default-features = false }
esp-radio = { version = "0.18.0", default-features = false }
esp-rtos = { version = "0.3.0", default-features = false }
heapless = { version = "0.9", default-features = false }
image = { version = "0.25.9", default-features = false, features = ["png"] }
linn-ci-gateway = { path = "crates/linn-ci-gateway" }
linn-lpec = { path = "crates/linn-lpec" }
mplusfonts = { version = "0.3.4", default-features = false }
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
zune-core = { version = "0.5.1", default-features = false }
zune-jpeg = { version = "0.5.15", default-features = false }
